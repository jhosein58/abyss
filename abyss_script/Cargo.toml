[workspace]

resolver = "2"

members = [
    "bindings/js",
    "bindings/python"
]



[package]
name = "abyss_script"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
abyss_diagnostics = { path = "../compiler/abyss_diagnostics" }
abyss_ir = { path = "../compiler/abyss_ir" }
abyss_vm = { path = "../compiler/abyss_vm" }

wasm-bindgen = "0.2"
js-sys = "0.3"
