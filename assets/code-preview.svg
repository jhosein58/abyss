<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 690" width="100%" height="100%" style="background: transparent; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;">
  <rect x="1" y="1" width="758" height="688" rx="12" ry="12" fill="#000000" stroke="#1e293b" stroke-width="1" />
  <text x="36" y="44" font-size="14" font-weight="500"><tspan fill="#f43f5e">import</tspan>&#160;<tspan fill="#c084fc">print</tspan><tspan fill="#94a3b8">,&#160;</tspan><tspan fill="#c084fc">printf</tspan>&#160;<tspan fill="#f43f5e">from</tspan>&#160;<tspan fill="#34d399">"std/io"</tspan></text>
  <text x="36" y="90" font-size="14" font-weight="500"><tspan fill="#38bdf8">Point</tspan><tspan fill="#94a3b8">&#160;::&#160;</tspan><tspan fill="#f43f5e">struct</tspan><tspan fill="#94a3b8">&#160;{</tspan></text>
  <text x="36" y="113" font-size="14" font-weight="500"><tspan fill="#f8fafc">&#160;&#160;&#160;&#160;x</tspan><tspan fill="#94a3b8">,&#160;</tspan><tspan fill="#f8fafc">y</tspan>&#160;<tspan fill="#38bdf8">i32</tspan></text>
  <text x="36" y="159" font-size="14" font-weight="500"><tspan fill="#c084fc">&#160;&#160;&#160;&#160;dist_sq</tspan><tspan fill="#94a3b8">&#160;::&#160;</tspan><tspan fill="#f43f5e">fn</tspan><tspan fill="#f8fafc">(self&#160;</tspan><tspan fill="#38bdf8">&amp;Self</tspan><tspan fill="#f8fafc">)&#160;</tspan><tspan fill="#38bdf8">i32</tspan><tspan fill="#94a3b8">&#160;{</tspan></text>
  <text x="36" y="182" font-size="14" font-weight="500"><tspan fill="#f8fafc">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;self.x&#160;</tspan><tspan fill="#38bdf8">*</tspan><tspan fill="#f8fafc">&#160;self.x&#160;</tspan><tspan fill="#38bdf8">+</tspan><tspan fill="#f8fafc">&#160;self.y&#160;</tspan><tspan fill="#38bdf8">*</tspan><tspan fill="#f8fafc">&#160;self.y</tspan></text>
  <text x="36" y="205" font-size="14" font-weight="500"><tspan fill="#94a3b8">&#160;&#160;&#160;&#160;}</tspan></text>
  <text x="36" y="228" font-size="14" font-weight="500"><tspan fill="#94a3b8">}</tspan></text>
  <text x="36" y="274" font-size="14" font-weight="500"><tspan fill="#38bdf8">TypeByCond</tspan><tspan fill="#94a3b8">&#160;::&#160;</tspan><tspan fill="#f43f5e">fn</tspan><tspan fill="#f8fafc">(cond&#160;</tspan><tspan fill="#38bdf8">bool</tspan><tspan fill="#f8fafc">)&#160;</tspan><tspan fill="#f43f5e">type</tspan><tspan fill="#94a3b8">&#160;{</tspan></text>
  <text x="36" y="297" font-size="14" font-weight="500"><tspan fill="#f43f5e">&#160;&#160;&#160;&#160;if</tspan><tspan fill="#f8fafc">&#160;cond&#160;{&#160;</tspan><tspan fill="#38bdf8">i32</tspan><tspan fill="#f8fafc">&#160;}&#160;</tspan><tspan fill="#f43f5e">else</tspan><tspan fill="#f8fafc">&#160;{&#160;</tspan><tspan fill="#38bdf8">f32</tspan><tspan fill="#94a3b8">&#160;}</tspan></text>
  <text x="36" y="320" font-size="14" font-weight="500"><tspan fill="#94a3b8">}</tspan></text>
  <text x="36" y="366" font-size="14" font-weight="500"><tspan fill="#c084fc">main</tspan><tspan fill="#94a3b8">&#160;::&#160;</tspan><tspan fill="#f43f5e">fn</tspan><tspan fill="#94a3b8">()&#160;{</tspan></text>
  <text x="36" y="389" font-size="14" font-weight="500"><tspan fill="#f8fafc">&#160;&#160;&#160;&#160;p:&#160;</tspan><tspan fill="#38bdf8">Point</tspan><tspan fill="#f8fafc">&#160;=&#160;.{&#160;x:&#160;</tspan><tspan fill="#fb923c">3</tspan><tspan fill="#f8fafc">,&#160;y:&#160;</tspan><tspan fill="#fb923c">4</tspan><tspan fill="#94a3b8">&#160;}</tspan></text>
  <text x="36" y="412" font-size="14" font-weight="500"><tspan fill="#c084fc">&#160;&#160;&#160;&#160;printf</tspan><tspan fill="#34d399">("Point&#160;({},&#160;{}),&#160;dist_sq&#160;=&#160;{}\n"</tspan><tspan fill="#f8fafc">,&#160;.{p.x,&#160;p.y,&#160;p.</tspan><tspan fill="#c084fc">dist_sq</tspan><tspan fill="#f8fafc">()})</tspan></text>
  <text x="36" y="458" font-size="14" font-weight="500"><tspan fill="#f8fafc">&#160;&#160;&#160;&#160;val&#160;:=&#160;</tspan><tspan fill="#f43f5e">cmpt</tspan><tspan fill="#94a3b8">&#160;{</tspan></text>
  <text x="36" y="481" font-size="14" font-weight="500"><tspan fill="#f8fafc">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;base&#160;:=&#160;</tspan><tspan fill="#fb923c">20</tspan></text>
  <text x="36" y="504" font-size="14" font-weight="500"><tspan fill="#f8fafc">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;base&#160;</tspan><tspan fill="#38bdf8">*</tspan>&#160;<tspan fill="#fb923c">2</tspan><tspan fill="#38bdf8">&#160;+&#160;</tspan><tspan fill="#fb923c">2</tspan></text>
  <text x="36" y="527" font-size="14" font-weight="500"><tspan fill="#94a3b8">&#160;&#160;&#160;&#160;}</tspan></text>
  <text x="36" y="550" font-size="14" font-weight="500"><tspan fill="#c084fc">&#160;&#160;&#160;&#160;printf</tspan><tspan fill="#34d399">("Compile-time&#160;evaluated:&#160;{}\n"</tspan><tspan fill="#f8fafc">,&#160;.{val})</tspan></text>
  <text x="36" y="596" font-size="14" font-weight="500"><tspan fill="#f8fafc">&#160;&#160;&#160;&#160;x:&#160;</tspan><tspan fill="#38bdf8">TypeByCond</tspan><tspan fill="#94a3b8">(</tspan><tspan fill="#fb923c">true</tspan><tspan fill="#94a3b8">)&#160;=&#160;</tspan><tspan fill="#fb923c">100</tspan></text>
  <text x="36" y="619" font-size="14" font-weight="500"><tspan fill="#c084fc">&#160;&#160;&#160;&#160;print</tspan><tspan fill="#f8fafc">(x)</tspan></text>
  <text x="36" y="642" font-size="14" font-weight="500"><tspan fill="#94a3b8">}</tspan></text>
</svg>