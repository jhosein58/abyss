<svg xmlns="http://www.w3.org/2000/svg" class="brand-logo" viewBox="230 250 2750 740">
  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.16"></feDropShadow>
    </filter>
    <style>
      .abyss-glyph, .abyss-text {
        fill: #05070a;
      }
      .abyss-text {
        font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
