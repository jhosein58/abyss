name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gcc-mingw-w64-x86-64 clang tcc zip wine64 wine ripgrep || true

      - name: Fetch seed compiler
        run: |
          mkdir -p /tmp/seed
          curl -fsSL "https://github.com/jhosein58/abyss/releases/latest/download/abyss-linux-x86_64.tar.gz" -o /tmp/seed/abyss.tar.gz
          tar -xzf /tmp/seed/abyss.tar.gz -C /tmp/seed --strip-components=1
          cp /tmp/seed/bin/abyssc ./abyssc
          chmod +x ./abyssc

      - name: Run compiler and pod tests
        run: |
          ./abyss test
          ./abyss test-pods

      - name: Build release artifacts
        run: |
          ./abyss release 3

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Abyss ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/abyss-linux-x86_64.tar.gz
            dist/abyss-linux-x86_64.tar.gz.sha256
            dist/abyss-windows-x86_64.zip
            dist/abyss-windows-x86_64.zip.sha256
            dist/abyssc.wasm
            dist/vfs_bundle.json
            dist/bootstrap.c
